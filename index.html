<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2d6a4f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png">
<title>Pantry</title>
<style>
:root{--bg:#f6f7f4;--fg:#1c1d1a;--mut:#666a62;--card:#fff;--bd:#d9dcd3;--ac:#2d6a4f;--acf:#fff;--low:#c2410c;--lowbg:#fff0e6;--okbg:#e8f4ec;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#131412;--fg:#ecede8;--mut:#9a9e94;--card:#1f211e;--bd:#383b36;--ac:#6fcf97;--acf:#10130f;--low:#f59e6b;--lowbg:#33251c;--okbg:#1a2a21;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.4 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;background:var(--bg);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 6px;z-index:5}h1{font-size:20px;margin:0}
main{max-width:760px;margin:0 auto;padding:6px 12px 96px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:6}
nav button{flex:1;border:0;background:none;padding:12px 4px;font:inherit;font-size:14px;color:var(--mut);border-radius:0}nav button.on{color:var(--ac);font-weight:700}
h3{margin:18px 0 6px;font-size:16px}
.m{color:var(--mut);font-size:14px}.w{color:var(--low);font-size:14px}
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.pill{flex:none;padding:10px 16px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit}.pill.on{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:600}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:6px 0 10px}.bar b{flex:1;min-width:120px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:8px 0}.card.low{background:var(--lowbg)}.card.ok{background:var(--okbg)}
.nm{font-weight:600;margin-bottom:2px}.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{min-width:44px;height:44px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;font-size:17px;padding:0}
.chip.wide{min-width:0;padding:0 14px;font-size:15px}.chip.sel{background:var(--ac);color:var(--acf);border-color:var(--ac);font-weight:700}.chip.sel.low{background:var(--low);border-color:var(--low);color:#fff}
button,input,textarea,select{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}button{cursor:pointer}
button.pri{background:var(--ac);color:var(--acf);border-color:var(--ac)}button.sm{padding:6px 10px;font-size:14px}
input[type=search],input[type=text]{width:100%}textarea{width:100%;min-height:110px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}.row>input{flex:1;min-width:120px}
.li{display:flex;gap:12px;align-items:flex-start}.li input[type=checkbox]{width:26px;height:26px;flex:none;margin-top:2px}
.qty{flex:none;min-width:34px;font-weight:700;font-size:18px;text-align:right}.li .body{flex:1;min-width:0}
.done .nm,.done .qty{text-decoration:line-through;opacity:.5}
.prod{font-size:13px;color:var(--mut);overflow-wrap:anywhere}.tag{display:inline-block;font-size:12px;font-weight:400;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;margin-left:6px;color:var(--mut)}
.aisle{margin:16px 0 2px;font-size:13px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
/* Compare page: made for a computer screen, still usable on a phone */
body[data-tab=compare] main{max-width:1180px}
.opt{display:grid;grid-template-columns:62px minmax(0,1fr) 92px 112px 116px;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.opt.off{opacity:.55}.opt .pn{overflow-wrap:anywhere}.opt .pn a{color:inherit}.num{text-align:right;font-variant-numeric:tabular-nums}
.step{display:flex;gap:4px;align-items:center;justify-content:flex-end}.step button{padding:4px 10px;min-width:34px}.step b{min-width:22px;text-align:center}
.st{font-size:12px;font-weight:700;border-radius:6px;padding:2px 6px;text-align:center}.st.W{background:#0071ce;color:#fff}.st.M{background:#e2231a;color:#fff}
.deal{color:var(--low);font-weight:700;font-size:13px}.old{color:var(--mut);font-size:12px}
.ihead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.ihead .qty{min-width:28px}.ihead .nm{flex:1;margin:0}
.mini{display:inline-flex;gap:4px}.mini button{padding:2px 8px;font-size:13px}
.basket{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}.basket table{width:100%;border-collapse:collapse;font-size:14px}.basket td{padding:4px 2px;border-top:1px solid var(--bd);vertical-align:top}
@media(max-width:700px){.opt{grid-template-columns:50px minmax(0,1fr) 84px;}.opt .u{display:none}.opt .step{grid-column:2/4}}
/* Organize page (computer) */
body[data-tab=organize] main{max-width:1280px}
.org{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:14px;align-items:start}
.olist{max-height:calc(100vh - 220px);overflow:auto;border:1px solid var(--bd);border-radius:12px;background:var(--card)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:7px 10px;border-bottom:1px solid var(--bd);cursor:pointer;font-size:14px}
.orow:hover{background:var(--okbg)}.orow.on{background:var(--ac);color:var(--acf)}.orow.on .m{color:var(--acf)}
.ogrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.ogrid label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:3px}
.ogrid input,.ogrid select{width:100%;padding:7px 8px}
.prow{display:grid;grid-template-columns:62px minmax(0,1fr) 90px 120px;gap:4px 8px;align-items:center;padding:6px 0;border-top:1px solid var(--bd);font-size:14px}
.prow .acts{grid-column:2/-1}.prow.off{opacity:.55}
.prow select,.prow input{padding:5px 6px;font-size:13px}
@media(max-width:900px){.org{grid-template-columns:1fr}.olist{max-height:40vh}.prow{grid-template-columns:50px minmax(0,1fr) 90px}.prow .u{display:none}.prow .acts{grid-column:1/4}}
@media(max-width:600px){nav .pc{display:none}}
</style></head><body>
<header><h1 id="ttl">Pantry</h1></header><main id="app"></main><nav id="nav"></nav>
<script>
'use strict';
/* ============================================================================================
   Pantry v2 – data model
   DB (synced between devices):
     areas    [{id, name}]                                   e.g. {id:'fridge-main', name:'Fridge (main)'}
     items    {id: {name, aisle, follow, targets{areaId:n}, match, targetPrice, note, stats{b12,q}}}
              follow: normal | seasonal (reminder) | deal (only when on sale) | retired
              match:  any (any non-excluded product) | preferred (only "preferred" products: exactly this one)
     products {key: {store, id, alt[], name, brand, item, status, url, size, n, n12, last, qty}}   key "W:<id>" / "M:<id>"
              status: preferred | ok | excluded | new
     barcodes {code: {name, item, for, dairy, gluten, traces, ok, src}}   (products scanned with the phone)
     counts   {areaId: {itemId: {n, at, h[]}}}   h = previous counts (the items that vary most are shown first)
     checked  {itemId: true}   ticks on the shopping list
     extra    {itemId: n}      seasonal / deal items added to the list by hand
   PRICES (this device only, localStorage, not synced): {productKey: [[date, price, unitPrice, unitBase, wasPrice, source]]}
   ============================================================================================ */
const KEY = 'pantry_v2', KEY1 = 'pantry_v1', PKEY = 'pantry_prices';
const D0 = () => ({ v: 2, areas: [], items: {}, products: {}, barcodes: {}, counts: {}, checked: {}, extra: {}, ts: 0 });
const AISLES = ['Produce', 'Bakery', 'Dairy & alternatives', 'Meat & fish', 'Deli', 'Frozen', 'Pantry', 'Snacks', 'Drinks', 'Household', 'Personal care'];
let DB = D0(), PRICES = {};
let tab = 'count', CUR = '', EDIT = false, Q = '', MSG = '';

const load = k => { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } };
(function init() {
  const x = load(KEY);
  if (x && x.v === 2) DB = Object.assign(D0(), x);
  else {
    // First start of v2: keep the v1 data aside, carry over the barcodes scanned with the phone (to re-link to items).
    const old = load(KEY1);
    if (old) {
      try { localStorage.setItem('pantry_v1_backup', JSON.stringify(old)); } catch (e) {}
      Object.entries(old.products || {}).forEach(([code, p]) => { const b = Object.assign({}, p, { item: null, oldGroup: p.group || '' }); delete b.group; DB.barcodes[code] = b; });
    }
  }
  PRICES = load(PKEY) || {};
})();
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { alert('Storage full: ' + e.message); } };
const save = () => { DB.ts = Date.now(); persist(); push(); };
const savePrices = () => { try { localStorage.setItem(PKEY, JSON.stringify(PRICES)); } catch (e) { alert('Prices could not be stored on this device: ' + e.message); } };

// ---------- small helpers ----------
const $ = (t, a, ...k) => { const e = document.createElement(t); Object.assign(e, a || {}); k.flat().forEach(c => c != null && c !== '' && e.append(c)); return e; };
const slug = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
const ago = t => { const d = Math.floor((Date.now() - t) / 864e5); return d < 1 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
const money = v => v == null ? '' : Number(v).toFixed(2).replace('.', ',') + ' $';
const it = id => DB.items[id];
const live = id => { const x = it(id); return x && x.follow !== 'retired'; };
const tg = (a, i) => ((it(i) || {}).targets || {})[a] || 0;
const cn = (a, i) => (DB.counts[a] || {})[i] || null;
const total = i => Object.values((it(i) || {}).targets || {}).reduce((s, n) => s + n, 0);
const have = i => DB.areas.reduce((s, a) => { const c = cn(a.id, i); return s + (c ? c.n : 0); }, 0);
const unc = i => DB.areas.filter(a => tg(a.id, i) > 0 && !cn(a.id, i));
const need = i => Math.max(0, total(i) - have(i));
const aisleIx = i => { const k = AISLES.indexOf((it(i) || {}).aisle); return k < 0 ? 99 : k; };
const byAisle = (x, y) => aisleIx(x) - aisleIx(y) || it(x).name.localeCompare(it(y).name);
const cur = () => DB.areas.find(x => x.id === CUR) || DB.areas[0];

function setT(a, i, n) { const x = it(i); x.targets = x.targets || {}; if (n) x.targets[a] = n; else delete x.targets[a]; save(); }
function setC(a, i, n) {
  const m = DB.counts[a] = DB.counts[a] || {}, c = m[i];
  // A correction within 10 minutes replaces the count; otherwise the old value goes to the history.
  const h = !c ? [] : (Date.now() - c.at < 6e5 ? (c.h || []) : (c.h || []).concat(c.n).slice(-8));
  m[i] = { n, at: Date.now(), h }; save();
}
// How much an item's count moves between counts (bigger = shown first in the count list).
function variation(a, i) { const c = cn(a, i); if (!c || !c.h || c.h.length < 2) return -1; const s = c.h.concat(c.n); let t = 0; for (let k = 1; k < s.length; k++) t += Math.abs(s[k] - s[k - 1]); return t / (s.length - 1); }

// Products of an item, best first: preferred, then most bought; excluded ones last.
const prodsOf = i => Object.entries(DB.products).filter(([, p]) => p.item === i)
  .sort(([, a], [, b]) => (a.status === 'excluded') - (b.status === 'excluded') || (b.status === 'preferred') - (a.status === 'preferred') || (b.n || 0) - (a.n || 0));
const usual = (i, store) => { const x = it(i); const e = prodsOf(i).find(([, p]) => p.store === store && p.status !== 'excluded' && (x.match !== 'preferred' || p.status === 'preferred')); return e ? e[1] : null; };
const pname = p => ((p.brand && !p.name.startsWith(p.brand) ? p.brand + ' ' : '') + p.name).trim();
const lastPrice = key => { const s = PRICES[key]; if (!s || !s.length) return null; const shelf = s.filter(x => x[5] === 'shelf'), src = shelf.length ? shelf : s; return src[src.length - 1]; };

/* ================================== COUNT ================================== */
function areaItems(a) {
  return Object.keys(DB.items).filter(i => live(i) && (tg(a.id, i) > 0 || (cn(a.id, i) && cn(a.id, i).n > 0)))
    .sort((x, y) => variation(a.id, y) - variation(a.id, x) || byAisle(x, y));
}
function cRow(a, i) {
  const x = it(i), T = tg(a.id, i), c = cn(a.id, i), n = c ? c.n : null, st = n == null ? '' : n < T ? 'low' : 'ok', mx = Math.min(12, Math.max(T + 2, 5));
  const what = x.follow === 'deal' ? 'when on sale ' + T : x.follow === 'seasonal' ? 'seasonal' : x.follow === 'extra' ? 'extra (now and then)' : T ? 'wanted ' + T : 'not wanted here';
  const r = $('div', { className: 'card ' + st }, $('div', { className: 'nm', textContent: x.name }),
    $('div', { className: 'm', textContent: what + ' · ' + (c ? 'counted ' + ago(c.at) : 'not counted yet') }),
    $('div', { className: 'chips' }, Array.from({ length: mx + 1 }, (_, k) => $('button', { className: 'chip' + (n === k ? ' sel' + (st === 'low' ? ' low' : '') : ''), textContent: k,
      onclick: () => { setC(a.id, i, k); r.replaceWith(cRow(a, i)); prog(); } })), n > mx ? $('button', { className: 'chip sel', textContent: n }) : ''));
  return r;
}
function prog() { const a = cur(), e = document.getElementById('prog'); if (!a || !e) return; const its = areaItems(a); e.textContent = a.name + ': ' + its.filter(i => cn(a.id, i)).length + ' of ' + its.length + ' counted'; }
function eRow(a, i) {
  const x = it(i), t = tg(a.id, i);
  const r = $('div', { className: 'card' }, $('div', { className: 'nm', textContent: x.name }),
    $('div', { className: 'm', textContent: 'here: ' + t + ' · all areas: ' + total(i) + (x.stats && x.stats.q ? ' · usually bought ' + x.stats.q + ' at a time' : '') }),
    $('div', { className: 'chips' }, Array.from({ length: 11 }, (_, k) => $('button', { className: 'chip' + (t === k ? ' sel' : ''), textContent: k, onclick: () => { setT(a.id, i, k); r.replaceWith(eRow(a, i)); } }))));
  return r;
}
function vCount() {
  const v = $('div'), a = cur();
  if (!Object.keys(DB.items).length) { v.append($('div', { className: 'card' }, $('div', { className: 'nm', textContent: 'No items yet' }), $('p', { className: 'm', textContent: 'Go to Setup and import your data file (pantry-data-v2.json).' }), $('button', { className: 'pri', textContent: 'Open Setup', onclick: () => { tab = 'setup'; draw(); } }))); return v; }
  v.append($('div', { className: 'pills' }, DB.areas.map(x => $('button', { className: 'pill' + (x === a ? ' on' : ''), textContent: x.name, onclick: () => { CUR = x.id; EDIT = false; draw.last = null; draw(); } }))));   // a new area starts at the top
  if (!a) return v;
  if (EDIT) {
    const box = $('div'), inp = $('input', { type: 'search', placeholder: 'Search items…', value: Q, oninput: e => { Q = e.target.value; fill(); } }), nw = $('input', { type: 'text', placeholder: 'New item name (e.g. Apples)' });
    const fill = () => { const q = Q.toLowerCase(); const ids = Object.keys(DB.items).filter(i => live(i) && (!q || it(i).name.toLowerCase().includes(q)))
      .sort((x, y) => (tg(a.id, y) > 0) - (tg(a.id, x) > 0) || byAisle(x, y)); box.replaceChildren(...ids.slice(0, q ? 200 : 80).map(i => eRow(a, i))); };
    v.append($('div', { className: 'bar' }, $('b', { textContent: 'What lives in ' + a.name }), $('button', { className: 'pri', textContent: 'Done', onclick: () => { EDIT = false; Q = ''; draw(); } })),
      $('p', { className: 'm', textContent: 'Tap how many you want to keep in this area. Items already here come first; search to add others.' }), inp,
      $('div', { className: 'row' }, nw, $('button', { textContent: 'Add item', onclick: () => { const n = nw.value.trim(); if (!n) return; let id = slug(n); while (DB.items[id] && DB.items[id].name !== n) id += '-2';
        if (!DB.items[id]) DB.items[id] = { name: n, aisle: '', follow: 'normal', targets: {}, match: 'any', targetPrice: null, note: '' }; setT(a.id, id, Math.max(1, tg(a.id, id))); nw.value = ''; Q = n; inp.value = n; fill(); } })), box);
    fill(); return v;
  }
  const its = areaItems(a);
  v.append($('div', { className: 'bar' }, $('b', { id: 'prog' }), $('button', { textContent: 'Edit items', onclick: () => { EDIT = true; draw(); } }),
    its.length ? $('button', { textContent: 'All good', onclick: () => { if (confirm('Mark every item in ' + a.name + ' as fully stocked?')) { its.filter(i => tg(a.id, i) > 0 && it(i).follow === 'normal').forEach(i => setC(a.id, i, tg(a.id, i))); draw(); } } }) : ''));
  if (!its.length) v.append($('p', { className: 'm', textContent: 'Nothing here yet. Tap Edit items to choose what lives in ' + a.name + '.' }));
  its.forEach(i => v.append(cRow(a, i))); setTimeout(prog);
  // Keep the chosen area visible in the bar (on a phone the bar scrolls sideways).
  setTimeout(() => { const on = document.querySelector('.pill.on'); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); });
  return v;
}

/* ================================== LIST ================================== */
// compare = true: the rows of the Compare page (extras are shown in their own section there).
function listRows(compare) {
  const rows = [], recent = DB.picks && Date.now() - DB.picks.at < 14 * 864e5, skip = new Set(recent ? DB.picks.skipped || [] : []);
  Object.keys(DB.items).forEach(i => {
    const x = it(i);
    if (x.follow === 'normal' && need(i) > 0) rows.push({ i, q: need(i) + (DB.extra[i] || 0), skip: !compare && skip.has(i) });
    else if (x.follow === 'extra') { const n = Object.values(PL()[i] || {}).reduce((s, k) => s + k, 0); if (n > 0 && !compare) rows.push({ i, q: n, extra: true }); }
    else if (x.follow !== 'retired' && DB.extra[i] > 0) rows.push({ i, q: DB.extra[i], extra: true });
  });
  return rows.sort((r1, r2) => byAisle(r1.i, r2.i));
}
const copy = t => { try { navigator.clipboard.writeText(t); MSG = 'Copied.'; } catch (e) { MSG = 'Copy failed.'; } };
// Products chosen in Compare (on the computer) for this item, if recent: [{p, n}]; null = use the usual products.
function picked(i) {
  const pk = DB.picks; if (!pk || !pk.items || !pk.items[i] || Date.now() - pk.at > 14 * 864e5) return null;
  const out = Object.entries(pk.items[i]).map(([k, n]) => ({ p: DB.products[k], n })).filter(x => x.p && x.n > 0);
  return out.length ? out : null;
}
function vList() {
  const all = listRows(), rows = all.filter(r => !r.skip), skippedRows = all.filter(r => r.skip);
  const v = $('div');
  let nc = 0; Object.keys(DB.items).forEach(i => { if (it(i).follow === 'normal') nc += unc(i).length; });
  // Per store: the products chosen in Compare when there are some, otherwise the usual product at that store.
  const forStore = s => rows.filter(r => !DB.checked[r.i]).flatMap(r => { const pk = picked(r.i);
    if (pk) return pk.filter(x => x.p.store === s).map(x => x.n + '\t' + pname(x.p));
    const p = usual(r.i, s); return p ? [r.q + '\t' + pname(p)] : []; }).join('\n');
  v.append($('div', { className: 'bar' }, $('b', { textContent: rows.length + ' item' + (rows.length === 1 ? '' : 's') + ' to buy' }),
    $('button', { className: 'sm', textContent: 'Copy list', title: 'quantity <tab> item, one per line', onclick: () => { copy(rows.filter(r => !DB.checked[r.i]).map(r => r.q + '\t' + it(r.i).name).join('\n')); draw(); } }),
    $('button', { className: 'sm', textContent: 'Copy for Walmart', onclick: () => { copy(forStore('Walmart')); draw(); } }),
    $('button', { className: 'sm', textContent: 'Copy for Maxi', onclick: () => { copy(forStore('Maxi')); draw(); } }),
    $('button', { className: 'sm', textContent: 'Clear ticks', onclick: () => { DB.checked = {}; save(); draw(); } })));
  if (MSG) { v.append($('p', { className: 'm', textContent: MSG })); MSG = ''; }
  if (nc) v.append($('p', { className: 'w', textContent: nc + ' item slot' + (nc === 1 ? '' : 's') + ' not counted yet, so this list may be longer than needed.' }));
  if (rows.some(r => picked(r.i))) v.append($('p', { className: 'm', textContent: 'Products chosen in Compare on ' + new Date(DB.picks.at).toLocaleString() + '. Items without a choice show the usual products.' }));
  let lastA = null;
  rows.forEach(({ i, q, extra }) => {
    const x = it(i), ck = !!DB.checked[i];
    if (x.aisle !== lastA) { lastA = x.aisle; v.append($('div', { className: 'aisle', textContent: x.aisle || 'Other' })); }
    const pw = usual(i, 'Walmart'), pm = usual(i, 'Maxi'), pk = picked(i);
    v.append($('div', { className: 'card li' + (ck ? ' done' : '') },
      $('input', { type: 'checkbox', checked: ck, onchange: e => { if (e.target.checked) DB.checked[i] = true; else delete DB.checked[i]; save(); draw(); } }),
      $('div', { className: 'qty', textContent: q }),
